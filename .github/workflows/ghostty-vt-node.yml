name: Ghostty VT Native

on:
  push:
    branches: [main]
    paths:
      - 'packages/ghostty-vt-node/**'
      - '.github/workflows/ghostty-vt-node.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Follows the ci.yml concurrency convention (ci-oss- prefix), with
# ${{ github.workflow }} added so this workflow does not share a group with
# ci.yml — sharing one would make the two cancel each other on the same push.
concurrency:
  group: ci-oss-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            node-version: 20
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            node-version: 22
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            node-version: 24
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            node-version: 25
          - runner: macos-14
            platform: darwin
            arch: arm64
            node-version: 20
          - runner: macos-14
            platform: darwin
            arch: arm64
            node-version: 22
          - runner: macos-14
            platform: darwin
            arch: arm64
            node-version: 24
          - runner: macos-14
            platform: darwin
            arch: arm64
            node-version: 25
          # win32 builds on node 22 only. Node 20 was dropped because its
          # `npm ci` fails on windows-latest: better-sqlite3 (a daemon-core
          # dependency, unrelated to ghostty) ships no prebuilt for node 20's
          # ABI, so npm falls back to a node-gyp source build and the runner
          # has no Visual Studio C++ toolchain. node 22 gets a prebuilt and
          # installs fine on the same runner.
          #
          # Dropping it loses no coverage: the loader's tier-4 fallback accepts
          # ANY prebuilt for the same platform-arch (the .node files are
          # byte-identical per platform/arch), so the win32-x64 artifact built
          # here serves every Node ABI on Windows. Node 20 is also EOL.
          - runner: windows-latest
            platform: win32
            arch: x64
            node-version: 22

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # The zig pin lives in packages/ghostty-vt-node/toolchain.json only:
      # CMakeLists.txt refuses any other zig (and records the one it used), the
      # file is a binding digest input, and the release gate compares against
      # it, so changing the pin invalidates every previously built artifact.
      - name: Read toolchain pin
        id: toolchain
        run: echo "zig=$(node -p "require('./packages/ghostty-vt-node/toolchain.json').zig")" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          # Must satisfy ghostty's build.zig.zon (minimum_zig_version = "0.15.2").
          # `latest` floated to 0.16.0, which breaks the build (std.process.EnvMap
          # removed; requireZig() rejects it).
          version: ${{ steps.toolchain.outputs.zig }}
          # Never restore a zig cache into a release artifact build: the build
          # uses fresh private caches in its build tree anyway, and a restored
          # cache is mutable state from another run.
          use-cache: false

      - name: Install dependencies
        run: npm ci

      # Always compile from source. Plain `npm run build` copies the tracked
      # prebuilt in a fresh checkout (sources are never "locally modified"
      # there), so a binary that predates the current bridge/addon sources
      # would be staged and shipped as if it had just been built.
      - name: Build ghostty-vt-node
        env:
          ADHDEV_GHOSTTY_VT_FORCE_COMPILE: '1'
        run: npm run build -w packages/ghostty-vt-node

      - name: Test ghostty-vt-node
        run: node --test packages/ghostty-vt-node/test/*.test.mjs

      - name: Compute artifact triplet
        run: echo "GHOSTTY_TRIPLET=${{ matrix.platform }}-${{ matrix.arch }}-node$(node -p 'process.versions.modules')" >> "$GITHUB_ENV"

      - name: Stage native artifact
        run: |
          mkdir -p "dist-prebuilt/${GHOSTTY_TRIPLET}"
          shopt -s nullglob
          staged=0
          for pattern in \
            "packages/ghostty-vt-node/build/Release/ghostty_vt_node.node" \
            "packages/ghostty-vt-node/build/Release/libghostty-vt.*" \
            "packages/ghostty-vt-node/build/Release/ghostty-vt.dll"
          do
            for file in $pattern; do
              [ -f "$file" ] || continue
              cp "$file" "dist-prebuilt/${GHOSTTY_TRIPLET}/"
              staged=1
            done
          done
          ls -l "dist-prebuilt/${GHOSTTY_TRIPLET}"
          if [ "$staged" -ne 1 ]; then
            echo "No native artifacts were staged for ${GHOSTTY_TRIPLET}."
            exit 1
          fi
          # Stamp the manifest from the binary itself (embedded source digest,
          # file hashes), then exercise exactly the staged files.
          node packages/ghostty-vt-node/scripts/prebuilt-manifest.mjs write "dist-prebuilt/${GHOSTTY_TRIPLET}"
          node packages/ghostty-vt-node/scripts/verify-prebuilt.mjs "dist-prebuilt/${GHOSTTY_TRIPLET}"

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostty-vt-node-${{ env.GHOSTTY_TRIPLET }}
          path: dist-prebuilt/${{ env.GHOSTTY_TRIPLET }}
          if-no-files-found: error
